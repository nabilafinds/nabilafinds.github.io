<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nabila Adelia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5eee8;
      color: #3f3833;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 45px 25px 30px;
    }

    .profile {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      margin: 0 auto 18px;
      background: #e5d8ce;
      border: 4px solid white;
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      background-image: url("B84A54B2-9EE9-4563-A70E-4ACB0AE46BC8.jpeg");
      background-size: cover;
      background-position: center;
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 27px;
      font-weight: 700;
    }

    .bio {
      margin: 0 0 8px;
      font-size: 15px;
      color: #766b64;
    }

    .tagline {
      margin: 0 0 28px;
      font-size: 13px;
      color: #998d84;
    }

    .link {
      display: block;
      background: rgba(255,255,255,0.9);
      color: #403933;
      text-decoration: none;
      padding: 17px 20px;
      margin: 14px 0;
      border-radius: 18px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 5px 15px rgba(80,60,45,0.08);
      transition: all 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
    }

    .shop {
      background: #fffaf6;
      border: 1px solid #e6d7cc;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #a4978e;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="profile"></div>

    <h1>Nabila Adelia</h1>

    <p class="bio">
      Review • Beauty • Lifestyle ✨
    </p>

    <p class="tagline">
      Sharing things I genuinely love ♡
    </p>

    <a class="link shop" href="https://s.shopee.co.id/4fvxHAPaEY">
      🛍️ Shop My Finds
    </a>

    <a class="link" href="https://www.tiktok.com/@bilaadl_">
      🎵 TikTok — @bilaadl_
    </a>

    <a class="link" href="https://www.instagram.com/nabilaadl_/">
      📸 Instagram — @nabilaadl_
    </a>

    <div class="footer">
      Made with ♡ by Nabila
    </div>

  </div>

</body>
</html>
